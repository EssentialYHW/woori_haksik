name: 학식 수집

on:
  schedule:
    # 시간은 UTC. 정각을 피해 붐비는 시간대를 비켜 간다.
    - cron: "13 22 * * *"    # 매일 KST 07:13 (그날 메뉴)
    - cron: "43 1 * * 1-5"   # 평일 KST 10:43 (아침에 바뀐 메뉴 반영)
    - cron: "13 9 * * 5,6,0" # 금·토·일 KST 18:13 (다음 주 식단 올라왔는지)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s scraper/tests -t .

      - name: 동아대 수집
        run: python -m scraper.scrape --school donga

      - name: 부산가톨릭대 수집
        if: always()   # 동아대가 실패해도 따로 돈다 (실패하면 둘 다 메일로 알려줌)
        run: python -m scraper.scrape --school cup

      - name: 고려대 수집
        if: always()
        run: python -m scraper.scrape --school ku

      - name: 변경 사항 커밋
        if: always()   # 실패해도 status.json(실패 기록)은 남긴다
        run: |
          git config user.name "woori-haksik-bot"
          git config user.email "woori-haksik-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "학식 업데이트 $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull --rebase --autostash
            git push
          fi
